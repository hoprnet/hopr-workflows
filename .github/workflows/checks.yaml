################################################################################
# Reusable check pipeline
#
# Runs configurable code-quality checks (format, pre-commit, lint, deps, audit)
# via a matrix strategy with per-check enable/disable toggles and command
# overrides. A separate job fails PRs that add git conflict markers.
################################################################################
name: Checks
on:
  workflow_call:
    inputs:
      source_branch:
        required: true
        type: string
      cachix_cache_name:
        required: false
        type: string
        description: Cachix cache name. Defaults to the caller repository name (passed to setup-nix).
      cachix_extra_pull_names:
        required: false
        type: string
        description: Comma-separated list of additional Cachix caches to pull (substitute) from, read-only
      pre_commit:
        required: false
        type: boolean
        default: true
      format:
        required: false
        type: boolean
        default: true
      format_command:
        required: false
        type: string
        default: "nix fmt -- --ci"
      lint:
        required: false
        type: boolean
        default: true
      deps:
        required: false
        type: boolean
        default: true
      audit:
        required: false
        type: boolean
        default: true
      pre_commit_command:
        required: false
        type: string
        default: "nix build -L .#pre-commit-check"
      lint_command:
        required: false
        type: string
        default: "nix run -L .#check"
      deps_command:
        required: false
        type: string
        default: 'nix develop .#ci -c bash -c "cargo machete && cargo shear"'
      audit_command:
        required: false
        type: string
        default: "nix run .#audit"
      runner_small:
        required: false
        type: string
        default: depot-ubuntu-22.04
      runner_large:
        required: false
        type: string
        default: depot-ubuntu-22.04-4
      disable_sudo:
        required: false
        type: boolean
        default: true
      conflict_markers:
        required: false
        type: boolean
        default: false
        description: Fail PRs whose diff adds git conflict markers
      nix_path:
        required: false
        type: string
        default: nixpkgs=channel:nixos-26.05
        description: "Nix path to use"
    secrets:
      cachix_auth_token:
        required: true
permissions: {}
jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            enabled: ${{ inputs.format }}
            runner: ${{ inputs.runner_small }}
            timeout: 10
            command: ${{ inputs.format_command }}
          - name: Pre-commit
            enabled: ${{ inputs.pre_commit }}
            runner: ${{ inputs.runner_small }}
            timeout: 15
            command: ${{ inputs.pre_commit_command }}
          - name: Lint
            enabled: ${{ inputs.lint }}
            runner: ${{ inputs.runner_large }}
            timeout: 30
            command: ${{ inputs.lint_command }}
          - name: Deps
            enabled: ${{ inputs.deps }}
            runner: ${{ inputs.runner_large }}
            timeout: 10
            command: ${{ inputs.deps_command }}
          - name: Audit
            enabled: ${{ inputs.audit }}
            runner: ${{ inputs.runner_large }}
            timeout: 15
            command: ${{ inputs.audit_command }}
    steps:
      - name: Run ${{ matrix.name }}
        if: matrix.enabled
        # pinact resolves refs via the GitHub API; unauthenticated calls are rate-limited
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: hoprnet/hopr-workflows/actions/nix-action@25122332e302a7057c1cbd81605a3e2bf377342e # nix-action with setup-nix-v2.1.3
        with:
          source_branch: ${{ inputs.source_branch }}
          cachix_cache_name: ${{ inputs.cachix_cache_name }}
          cachix_extra_pull_names: ${{ inputs.cachix_extra_pull_names }}
          cachix_auth_token: ${{ secrets.cachix_auth_token }}
          command: ${{ matrix.command }}
          disable_sudo: ${{ inputs.disable_sudo }}
          nix_path: ${{ inputs.nix_path }}
  conflict-markers:
    name: Conflict markers
    # Only pull requests have a base to diff against.
    if: inputs.conflict_markers && github.base_ref != ''
    runs-on: ${{ inputs.runner_small }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fail on added conflict markers
        env:
          BASE_REF: ${{ github.base_ref }}
        # Port bots commit unresolved conflicts that GitHub never flags; added lines only, `=======` also underlines Markdown.
        run: |
          added="$(git diff --unified=0 "origin/${BASE_REF}...HEAD")"
          markers="$(echo "${added}" | grep -E '^\+(<<<<<<<|>>>>>>>)( |$)' || true)"
          if [ -n "${markers}" ]; then
            echo "::error::Conflict markers added by this pull request:"
            echo "${markers}"
            exit 1
          fi
