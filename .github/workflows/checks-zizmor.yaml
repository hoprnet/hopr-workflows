################################################################################
# Reusable zizmor security check pipeline
#
# Runs zizmor to scan GitHub Actions workflows for security issues and
# uploads the results as a SARIF file to the GitHub Security tab.
#
# This workflow declares its own `security-events: write` permission at
# the job level for the SARIF upload. No additional permissions are
# required from the caller. On fork PRs the token is read-only, so the
# analysis still runs (and fails on findings) but the SARIF upload is skipped.
################################################################################
name: Zizmor
on:
  workflow_call:
    inputs:
      repo_sha:
        required: true
        type: string
      cachix_cache_name:
        required: false
        type: string
        description: Cachix cache name. Defaults to the caller repository name (passed to setup-nix).
      cachix_extra_pull_names:
        required: false
        type: string
        description: Comma-separated list of additional Cachix caches to pull (substitute) from, read-only
      runner:
        required: false
        type: string
        default: depot-ubuntu-22.04
      zizmor_command:
        required: false
        type: string
        default: 'nix develop -L .#ci -c bash -c "zizmor --format sarif . > results.sarif"'
      nix_path:
        required: false
        type: string
        default: nixpkgs=channel:nixos-26.05
        description: "Nix path to use"
    secrets:
      cachix_auth_token:
        required: false
permissions: {}
jobs:
  zizmor:
    name: Zizmor
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Run zizmor
        uses: hoprnet/hopr-workflows/actions/nix-action@1bf79c9e93a016d5913ab57abefa9bff5f76e010 # nix-action (feat/fork-pr-ci-support)
        env:
          GH_TOKEN: ${{ github.token }}
          NIX_CONFIG: "access-tokens = github.com=${{ github.token }}"
        with:
          repo_sha: ${{ inputs.repo_sha }}
          cachix_cache_name: ${{ inputs.cachix_cache_name }}
          cachix_extra_pull_names: ${{ inputs.cachix_extra_pull_names }}
          cachix_auth_token: ${{ secrets.cachix_auth_token }}
          command: ${{ inputs.zizmor_command }}
          nix_path: ${{ inputs.nix_path }}
      # Fork PRs cannot upload to the Security tab. Keep the findings visible without blocking:
      # pre-existing findings must not fail the PR, the Security tab check runs on merge queue and push.

      - name: Upload SARIF file
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        uses: github/codeql-action/upload-sarif@89a39a4e59826350b863aa6b6252a07ad50cf83e # v4.32.4
        with:
          sarif_file: results.sarif
          category: zizmor
      - name: Upload SARIF as run artifact (fork PR)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: zizmor-sarif
          path: results.sarif
          if-no-files-found: ignore
      - name: Summarize zizmor findings (fork PR)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -f results.sarif ]; then
            count=$(jq '[.runs[].results[]?] | length' results.sarif)
            echo "zizmor findings: ${count} (not blocking)" | tee -a "${GITHUB_STEP_SUMMARY}"
            if [ "${count}" -gt 0 ]; then
              echo "There are zizmor findings." | tee -a "${GITHUB_STEP_SUMMARY}"
              exit 1
            fi
          fi
