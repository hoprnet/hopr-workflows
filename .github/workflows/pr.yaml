name: PR
on:
  pull_request:
    # "edited" re-runs the title lint when the PR title is fixed
    types: [opened, edited, reopened, synchronize]
permissions:
  contents: read
jobs:
  # The PR title becomes the squash commit on main, which release-tags.sh
  # parses to derive per-component version bumps
  conventional-title:
    runs-on: depot-ubuntu-22.04
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title against conventional commits
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
          # action names, reusable workflow component names (with and
          # without the workflow- tag-family prefix), and repo housekeeping
          scopes: |
            bump-version
            download-artifact-registry
            generate-release-notes
            multi-arch-manifest
            nix-action
            propose-ens-contenthash
            publish-rust-docs
            release-version
            set-build-version
            setup-gcp
            setup-nix
            setup-node-js
            sign-file
            upload-artifact-registry
            benchmarks
            build-binaries
            build-docker
            build-library
            checks
            checks-zizmor
            tests
            workflow-benchmarks
            workflow-checks
            workflow-checks-zizmor
            workflow-tests
            ci
            deps
            docs
            flake
            scripts
  format:
    uses: ./.github/workflows/checks.yaml
    with:
      source_branch: ${{ github.event.pull_request.head.sha }}
      pre_commit: false
      deps: false
      audit: false
      lint: true
      lint_command: "nix fmt && git diff --exit-code"
      disable_sudo: false
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN || '' }}
