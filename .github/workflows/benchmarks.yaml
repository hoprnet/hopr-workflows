name: Benchmarks
on:
  workflow_call:
    inputs:
      repo_sha:
        required: true
        type: string
        description: "Commit SHA to check out"
      runner:
        required: false
        type: string
        default: depot-ubuntu-22.04-4
      bencher_project:
        required: true
        type: string
        description: "Bencher project name"
      should_build:
        required: true
        type: boolean
        description: "Whether to build benchmarks"
      should_run:
        required: true
        type: boolean
        description: "Whether to run benchmarks after building them"
      build_command:
        required: true
        type: string
        description: "Command to build benchmarks"
      run_command:
        required: true
        type: string
        description: "Command to run benchmarks"
      nix_path:
        required: false
        type: string
        default: nixpkgs=channel:nixos-26.05
        description: "Nix path to use"
      zulip_stream:
        required: false
        type: string
        default: "HOPRd"
        description: "Zulip stream name"
      zulip_topic:
        required: false
        type: string
        default: "Benchmark regressions"
        description: "Zulip topic name"
    secrets:
      cachix_auth_token:
        required: false
      bencher_api_token:
        required: false
      ZULIP_API_KEY:
        required: false
      ZULIP_EMAIL:
        required: false
# Grants live on the jobs; the caller must allow at least the scopes they request
permissions: {}
jobs:
  build-benchmarks:
    name: Build Benchmarks
    # Fork PRs have no secrets: benchmarks run in the merge queue and on push
    if: inputs.should_build == true && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ inputs.repo_sha }}
      - name: Setup Nix
        uses: hoprnet/hopr-workflows/actions/setup-nix@8ce24b7561a6f7b46ed3133099b82828506f5f2d # setup-nix-v2.2.1
        with:
          cachix_auth_token: ${{ secrets.cachix_auth_token }}
          nix_path: ${{ inputs.nix_path }}
      - name: Build benchmarks
        run: eval "${BUILD_COMMAND}"
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
  run-benchmarks:
    name: Run Benchmarks
    needs: build-benchmarks
    if: always() && inputs.should_run == true && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && (needs.build-benchmarks.result == 'success' || needs.build-benchmarks.result == 'skipped')
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ inputs.repo_sha }}
      - name: Setup Nix
        uses: hoprnet/hopr-workflows/actions/setup-nix@8ce24b7561a6f7b46ed3133099b82828506f5f2d # setup-nix-v2.2.1
        with:
          cachix_auth_token: ${{ secrets.cachix_auth_token }}
          nix_path: ${{ inputs.nix_path }}
      - name: Install Bencher CLI
        uses: bencherdev/bencher@0f8f620172ccd6225d40a7590598eb7b41718af8
      - name: Execute and Upload (PR)
        if: github.event_name == 'pull_request'
        id: bencher_pr
        shell: bash
        run: |
          set +e
          bencher run \
            --project "${BENCHER_PROJECT}" \
            --token "${BENCHER_API_TOKEN}" \
            --adapter rust_criterion \
            --branch "${BENCHER_BRANCH}" \
            --github-actions "${GITHUB_TOKEN}" \
            --err \
            "${RUN_COMMAND}" 2>&1 | tee bencher_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          # Extract Bencher Run URL
          BENCHER_RUN_URL=$(grep -oE "https://bencher.dev/(console/projects/${BENCHER_PROJECT}/runs/|perf/${BENCHER_PROJECT}/reports/)[^[:space:]]+" bencher_output.txt | head -n 1)
          echo "bencher_run_url=${BENCHER_RUN_URL:-https://bencher.dev/console/projects/${BENCHER_PROJECT}}" >> "$GITHUB_OUTPUT"

          exit "$EXIT_CODE"
        env:
          BENCHER_API_TOKEN: ${{ secrets.bencher_api_token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BENCHER_PROJECT: ${{ inputs.bencher_project }}
          BENCHER_BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_COMMAND: ${{ inputs.run_command }}
      - name: Notify performance drop (PR)
        uses: zulip/github-actions-zulip/send-message@f675f2b4eb2a95fae974215476dcb7ad8dfeff6b # v2.0.2
        if: failure() && github.event_name == 'pull_request' && env.ZULIP_API_KEY != '' && env.ZULIP_EMAIL != ''
        env:
          ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
          ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
        with:
          api-key: ${{ env.ZULIP_API_KEY }}
          email: ${{ env.ZULIP_EMAIL }}
          organization-url: "https://hopr.zulipchat.com"
          type: "stream"
          to: "${{ inputs.zulip_stream }}"
          topic: "${{ inputs.zulip_topic }}"
          content: |
            Benchmark run failed or detected a regression for PR [#${{ github.event.pull_request.number }}](${{ github.event.pull_request.html_url }}) at commit [`${{ inputs.repo_sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ inputs.repo_sha }}).

            See [Bencher Run](${{ steps.bencher_pr.outputs.bencher_run_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}) for details.
      - name: Execute and Upload (Merge/Push)
        if: github.event_name != 'pull_request'
        id: bencher_merge
        shell: bash
        run: |
          set +e
          # Capture stdout and stderr, tee to file
          bencher run \
            --project "${BENCHER_PROJECT}" \
            --token "${BENCHER_API_TOKEN}" \
            --adapter rust_criterion \
            --branch "${BENCHER_BRANCH}" \
            --err \
            "${RUN_COMMAND}" 2>&1 | tee bencher_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          # Extract Bencher Report URL
          BENCHER_REPORT_URL=$(grep -oE "https://bencher.dev/(console/projects/${BENCHER_PROJECT}/reports/|perf/${BENCHER_PROJECT}/reports/)[^[:space:]]+" bencher_output.txt | head -n 1)
          echo "bencher_report_url=${BENCHER_REPORT_URL:-https://bencher.dev/console/projects/${BENCHER_PROJECT}}" >> "$GITHUB_OUTPUT"

          exit "$EXIT_CODE"
        env:
          BENCHER_API_TOKEN: ${{ secrets.bencher_api_token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BENCHER_PROJECT: ${{ inputs.bencher_project }}
          BENCHER_BRANCH: ${{ github.head_ref || github.ref_name }}
          RUN_COMMAND: ${{ inputs.run_command }}
      - name: Notify performance drop (Merge/Push)
        uses: zulip/github-actions-zulip/send-message@f675f2b4eb2a95fae974215476dcb7ad8dfeff6b # v2.0.2
        if: failure() && github.event_name != 'pull_request' && env.ZULIP_API_KEY != '' && env.ZULIP_EMAIL != ''
        env:
          ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
          ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
        with:
          api-key: ${{ env.ZULIP_API_KEY }}
          email: ${{ env.ZULIP_EMAIL }}
          organization-url: "https://hopr.zulipchat.com"
          type: "stream"
          to: "${{ inputs.zulip_stream }}"
          topic: "${{ inputs.zulip_topic }}"
          content: |
            Benchmark run failed or detected a regression on `${{ github.ref_name }}` at commit [`${{ inputs.repo_sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ inputs.repo_sha }}).

            See [Bencher Report](${{ steps.bencher_merge.outputs.bencher_report_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}) for details.
