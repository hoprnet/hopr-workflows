#################################################################################
# Pipeline to build libraries
#################################################################################
name: Build library
on:
  workflow_call:
    inputs:
      source_branch:
        required: true
        type: string
      version_type:
        required: true
        type: string
      architecture:
        required: true
        type: string
      cachix_cache_name:
        required: false
        type: string
        description: "Cachix cache name to use"
      nix_path:
        required: false
        type: string
        default: nixpkgs=channel:nixos-26.05
        description: "Nix path to use"
      build_file:
        required: false
        type: string
        default: "Cargo.toml"
        description: "File to extract version from"
      build_command:
        required: false
        type: string
        default: ""
        description: "Cacheable command that builds the library before Cargo validates or publishes it"
      package_name:
        required: false
        type: string
        description: "Name of the package being built"
      timeout_minutes:
        required: false
        type: number
        default: 60
        description: "Timeout for the job in minutes"
      runner:
        required: false
        type: string
        default: depot-ubuntu-22.04-4
      enabled:
        required: false
        type: boolean
        default: true
        description: "Whether to run this job"
      targets:
        required: false
        type: string
        default: ""
        description: "Space-separated Rust target triples passed as repeated --target flags to cargo release publish. Empty (default) verifies against the host triple only."
    secrets:
      cachix_auth_token:
        required: true
concurrency:
  group: ${{ github.repository }}-${{ inputs.source_branch }}-${{ github.workflow }}-${{ inputs.architecture }}-${{ inputs.package_name }}-library
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write
jobs:
  build:
    name: Build
    if: inputs.enabled
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          disable-sudo: true
          egress-policy: audit
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ inputs.source_branch }}
      - name: Setup Nix
        uses: hoprnet/hopr-workflows/actions/setup-nix@21a781128e2796400ae2f17c955dc602c8bc1400 # setup-nix-v2.1.0
        with:
          cachix_cache_name: ${{ inputs.cachix_cache_name }}
          cachix_auth_token: "${{ secrets.cachix_auth_token }}"
          nix_path: ${{ inputs.nix_path }}
      - name: Build library ${{ inputs.architecture }}
        if: inputs.build_command != ''
        shell: bash
        run: ${{ inputs.build_command }}
      - name: Build dry-run library
        if: inputs.version_type != 'release'
        shell: bash
        env:
          CONTEXT: ${{ inputs.package_name != '' && format('--package {0}', inputs.package_name) || '--workspace' }}
          TARGETS: ${{ inputs.targets }}
          NO_VERIFY: ${{ inputs.build_command != '' && '--no-verify' || '' }}
        run: |
          target_args=""
          for t in $TARGETS; do
            [[ "$t" =~ ^[a-zA-Z0-9_-]+$ ]] || { echo "::error::Invalid target triple: $t"; exit 1; }
            target_args="${target_args:+$target_args }--target $t"
          done
          # shellcheck disable=SC2086 # CONTEXT, target_args, and NO_VERIFY are intentionally word-split flag lists
          nix develop -c cargo release publish $CONTEXT $target_args --all-features $NO_VERIFY
      - name: Authenticate with crates.io
        if: inputs.version_type == 'release'
        id: auth
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
      - name: Publish library
        if: inputs.version_type == 'release'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CONTEXT: ${{ inputs.package_name != '' && format('--package {0}', inputs.package_name) || '--workspace' }}
          TARGETS: ${{ inputs.targets }}
          NO_VERIFY: ${{ inputs.build_command != '' && '--no-verify' || '' }}
        run: |-
          target_args=""
          for t in $TARGETS; do
            [[ "$t" =~ ^[a-zA-Z0-9_-]+$ ]] || { echo "::error::Invalid target triple: $t"; exit 1; }
            target_args="${target_args:+$target_args }--target $t"
          done
          # shellcheck disable=SC2086 # CONTEXT, target_args, and NO_VERIFY are intentionally word-split flag lists
          nix develop -c cargo release publish $CONTEXT $target_args --execute --all-features --no-confirm $NO_VERIFY
