name: Release Tags
on:
  push:
    branches:
      - main
# Tag pushes must not race when merges land back-to-back
concurrency:
  group: release-tags
jobs:
  tag:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: depot-ubuntu-22.04-4
    # A hung push must not block the serialized concurrency group for the
    # default 6h job timeout
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create component release tags
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: ./scripts/release-tags.sh "$BASE_SHA" "$HEAD_SHA"
