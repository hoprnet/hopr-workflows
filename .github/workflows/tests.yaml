################################################################################
# Reusable test + coverage pipeline
#
# Each job is individually conditional via `enable_*` inputs.
# Coverage runs after the corresponding test passes, or if the test was
# disabled (skipped). Coverage is gated to non-draft PRs, push, and
# merge_group events.
################################################################################
name: Tests
on:
  workflow_call:
    inputs:
      source_branch:
        required: true
        type: string
      cachix_cache_name:
        required: false
        type: string
        description: Cachix cache name. Defaults to the caller repository name (passed to setup-nix).
      enable_unit_tests:
        required: false
        type: boolean
        default: true
      enable_integration_tests:
        required: false
        type: boolean
        default: false
      enable_nightly_tests:
        required: false
        type: boolean
        default: false
      enable_benchmarks:
        required: false
        type: boolean
        default: false
      enable_unit_coverage:
        required: false
        type: boolean
        default: false
        description: Enable unit coverage report generation and upload.
      enable_integration_coverage:
        required: false
        type: boolean
        default: false
        description: Enable integration coverage report generation and upload.
      unit_test_command:
        required: false
        type: string
        default: "nix build -L .#test-unit"
      integration_test_command:
        required: false
        type: string
        default: "nix build -L .#test-integration"
      nightly_test_command:
        required: false
        type: string
        default: "nix build -L .#test-nightly"
      benchmark_command:
        required: false
        type: string
        default: "nix build .#bench-build"
      unit_coverage_command:
        required: false
        type: string
        default: "nix run .#coverage-unit"
      integration_coverage_command:
        required: false
        type: string
        default: "nix run .#coverage-integration"
      runner_unit:
        required: false
        type: string
        default: "depot-ubuntu-22.04"
        description: >-
          Runner for unit tests, nightly tests, benchmarks, and unit coverage.
      runner_integration:
        required: false
        type: string
        default: ""
        description: >-
          Runner for integration tests and coverage. Falls back to `runner_unit` if empty.
      test_timeout:
        required: false
        type: number
        default: 60
      benchmark_timeout:
        required: false
        type: number
        default: 20
      coverage_timeout:
        required: false
        type: number
        default: 60
      nix_path:
        required: false
        type: string
        default: nixpkgs=channel:nixos-26.05
        description: "Nix path to use"
    secrets:
      cachix_auth_token:
        required: true
permissions: {}
env:
  RUST_BACKTRACE: "1"
  FOUNDRY_PROFILE: ci
jobs:
  # ── Tests ──────────────────────────────────────────────────────────────────
  unit-test:
    name: Unit
    if: inputs.enable_unit_tests
    runs-on: ${{ inputs.runner_unit }}
    timeout-minutes: ${{ inputs.test_timeout }}
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - name: Run Unit
        uses: hoprnet/hopr-workflows/actions/nix-action@ade4bbd75f7204255c61d19c23f67d3da221e7d2 # nix-action-v1.1.3
        with:
          source_branch: ${{ inputs.source_branch }}
          cachix_cache_name: ${{ inputs.cachix_cache_name }}
          cachix_auth_token: ${{ secrets.cachix_auth_token }}
          command: ${{ inputs.unit_test_command }}
          nix_path: ${{ inputs.nix_path }}
  integration-test:
    name: Integration
    if: inputs.enable_integration_tests
    runs-on: ${{ inputs.runner_integration || inputs.runner_unit }}
    timeout-minutes: ${{ inputs.test_timeout }}
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - name: Run Integration
        uses: hoprnet/hopr-workflows/actions/nix-action@ade4bbd75f7204255c61d19c23f67d3da221e7d2 # nix-action-v1.1.3
        with:
          source_branch: ${{ inputs.source_branch }}
          cachix_cache_name: ${{ inputs.cachix_cache_name }}
          cachix_auth_token: ${{ secrets.cachix_auth_token }}
          command: ${{ inputs.integration_test_command }}
          nix_path: ${{ inputs.nix_path }}
  nightly-test:
    name: Unit Nightly
    if: inputs.enable_nightly_tests
    runs-on: ${{ inputs.runner_unit }}
    timeout-minutes: ${{ inputs.test_timeout }}
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - name: Run Unit Nightly
        uses: hoprnet/hopr-workflows/actions/nix-action@ade4bbd75f7204255c61d19c23f67d3da221e7d2 # nix-action-v1.1.3
        with:
          source_branch: ${{ inputs.source_branch }}
          cachix_cache_name: ${{ inputs.cachix_cache_name }}
          cachix_auth_token: ${{ secrets.cachix_auth_token }}
          command: ${{ inputs.nightly_test_command }}
          nix_path: ${{ inputs.nix_path }}
  # ── Benchmark ──────────────────────────────────────────────────────────────
  benchmark:
    name: Benchmark
    if: inputs.enable_benchmarks
    runs-on: ${{ inputs.runner_unit }}
    timeout-minutes: ${{ inputs.benchmark_timeout }}
    permissions:
      contents: read
    steps:
      - name: Run Benchmark
        uses: hoprnet/hopr-workflows/actions/nix-action@ade4bbd75f7204255c61d19c23f67d3da221e7d2 # nix-action-v1.1.3
        with:
          source_branch: ${{ inputs.source_branch }}
          cachix_cache_name: ${{ inputs.cachix_cache_name }}
          cachix_auth_token: ${{ secrets.cachix_auth_token }}
          command: ${{ inputs.benchmark_command }}
          nix_path: ${{ inputs.nix_path }}
  # ── Coverage ───────────────────────────────────────────────────────────────
  unit-coverage:
    name: Coverage / Unit
    needs: [unit-test]
    if: >-
      always() && inputs.enable_unit_coverage && (needs['unit-test'].result == 'success' || needs['unit-test'].result == 'skipped') && (github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
    runs-on: ${{ inputs.runner_unit }}
    timeout-minutes: ${{ inputs.coverage_timeout }}
    permissions:
      contents: read
      id-token: write
    env:
      CI: "true"
    steps:
      - name: Generate Unit report
        uses: hoprnet/hopr-workflows/actions/nix-action@ade4bbd75f7204255c61d19c23f67d3da221e7d2 # nix-action-v1.1.3
        with:
          source_branch: ${{ inputs.source_branch }}
          cachix_cache_name: ${{ inputs.cachix_cache_name }}
          cachix_auth_token: ${{ secrets.cachix_auth_token }}
          command: ${{ inputs.unit_coverage_command }}
          nix_path: ${{ inputs.nix_path }}
      - name: Upload Unit report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: >-
          github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          files: coverage.lcov
          flags: unit
          slug: ${{ github.repository }}
          use_oidc: true
          fail_ci_if_error: true
  integration-coverage:
    name: Coverage / Integration
    needs: [integration-test]
    if: >-
      always() && inputs.enable_integration_coverage && (needs['integration-test'].result == 'success' || needs['integration-test'].result == 'skipped') && (github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false))
    runs-on: ${{ inputs.runner_integration || inputs.runner_unit }}
    timeout-minutes: ${{ inputs.coverage_timeout }}
    permissions:
      contents: read
      id-token: write
    env:
      CI: "true"
    steps:
      - name: Generate Integration report
        uses: hoprnet/hopr-workflows/actions/nix-action@ade4bbd75f7204255c61d19c23f67d3da221e7d2 # nix-action-v1.1.3
        with:
          source_branch: ${{ inputs.source_branch }}
          cachix_cache_name: ${{ inputs.cachix_cache_name }}
          cachix_auth_token: ${{ secrets.cachix_auth_token }}
          command: ${{ inputs.integration_coverage_command }}
          nix_path: ${{ inputs.nix_path }}
      - name: Upload Integration report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: >-
          github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          files: coverage.lcov
          flags: integration
          slug: ${{ github.repository }}
          use_oidc: true
          fail_ci_if_error: true
