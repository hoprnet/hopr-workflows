#################################################################################
# Pipeline to clean up registry from artifacts and docker images
#################################################################################
name: Cleanup registry
env:
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: always
permissions:
  contents: read
on:
  schedule:
    - cron: "30 1 * * *" # Daily at 01:30 UTC
jobs:
  cleanup-registry:
    name: Cleanup Registry
    runs-on: depot-ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: false
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup GCP
        uses: hoprnet/hopr-workflows/actions/setup-gcp@ac3e0b6137b0ba470a30c373aab2ceba9e0879e4 # setup-gcp-v4
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_GITHUB }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          install_sdk: "true"
      - name: Setup Nix
        uses: hoprnet/hopr-workflows/actions/setup-nix@21a781128e2796400ae2f17c955dc602c8bc1400 # setup-nix-v2.1.0
        with:
          cachix_cache_name: hopr-workflows
          cachix_auth_token: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Cleanup Docker images
        timeout-minutes: 20
        run: nix run .#cleanup-docker-images -- -p hoprassociation -l europe-west3 -r docker-images
      - name: Cleanup Artifact files
        timeout-minutes: 20
        run: nix run .#cleanup-artifact-files -- -p hoprassociation -l europe-west3 -r rust-binaries
      - name: Cleanup NPM packages
        timeout-minutes: 20
        run: nix run .#cleanup-npm-packages -- -p hoprassociation -l europe-west3 -r npm
