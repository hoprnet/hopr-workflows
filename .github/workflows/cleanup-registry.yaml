#################################################################################
# Pipeline to clean up registry from artifacts and docker images
#################################################################################
name: Cleanup registry
env:
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: always
permissions:
  contents: read
on:
  schedule:
    - cron: "30 1 * * *" # Daily at 01:30 UTC
jobs:
  cleanup-registry:
    name: Cleanup Registry
    runs-on: depot-ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          disable-sudo: false
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup GCP
        uses: hoprnet/hopr-workflows/actions/setup-gcp@ac3e0b6137b0ba470a30c373aab2ceba9e0879e4 # setup-gcp-v4
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_GITHUB }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          install_sdk: "true"
      - name: Setup Nix
        uses: hoprnet/hopr-workflows/actions/setup-nix@eedb4b7701714299852ca5243f1544b817653f33 # setup-nix-v2.0.1
        with:
          cachix_cache_name: hopr-workflows
          cachix_auth_token: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Cleanup Docker images
        timeout-minutes: 20
        run: nix run .#cleanup-docker-images -- -p hoprassociation -l europe-west3 -r docker-images
      - name: Cleanup Artifact files
        timeout-minutes: 20
        run: nix run .#cleanup-artifact-files -- -p hoprassociation -l europe-west3 -r rust-binaries
      - name: Cleanup NPM packages
        timeout-minutes: 20
        run: nix run .#cleanup-npm-packages -- -p hoprassociation -l europe-west3 -r npm
