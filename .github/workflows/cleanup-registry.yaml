#################################################################################
# Pipeline to clean up registry from artifacts and docker images
#################################################################################
name: Cleanup registry
env:
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: always
permissions:
  contents: read
  id-token: write
on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *" # Daily at 01:30 UTC
jobs:
  cleanup-registry:
    name: Cleanup Registry
    runs-on: depot-ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          disable-sudo: false
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup GCP
        uses: hoprnet/hopr-workflows/actions/setup-gcp@2ca6e5b55819505e4e304ed3b0ff62da01cc7c0e # setup-gcp-v4.0.3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER_GITHUB }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          install_sdk: "true"
      - name: Setup Nix
        uses: hoprnet/hopr-workflows/actions/setup-nix@8ce24b7561a6f7b46ed3133099b82828506f5f2d # setup-nix-v2.2.1
        with:
          cachix_cache_name: hopr-workflows
          cachix_auth_token: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Cleanup Docker images
        timeout-minutes: 60
        run: nix run .#cleanup-docker-images -- -p hoprassociation -l europe-west3 -r docker-images
      - name: Cleanup Artifact files
        timeout-minutes: 60
        run: nix run .#cleanup-artifact-files -- -p hoprassociation -l europe-west3 -r rust-binaries
      - name: Cleanup NPM packages
        timeout-minutes: 60
        run: nix run .#cleanup-npm-packages -- -p hoprassociation -l europe-west3 -r npm
