#################################################################################
# Pipeline to build docker
#################################################################################
name: Build docker
env:
  RUST_BACKTRACE: "1"
  CARGO_TERM_COLOR: always
permissions:
  contents: read
on:
  workflow_call:
    inputs:
      repo_sha:
        required: true
        type: string
        description: "Commit SHA to build the binary image from"
      version_type:
        required: true
        type: string
        description: "Type of version to build: commit, pr, release"
      build_matrix:
        description: 'JSON string for the matrix strategy. Must include keys: runner, architecture, build_command, build_debug_command (optional), smoke_test_command (optional)'
        required: true
        type: string
      cachix_cache_name:
        required: false
        type: string
        description: "Cachix cache name to use"
      cachix_extra_pull_names:
        required: false
        type: string
        description: Comma-separated list of additional Cachix caches to pull (substitute) from, read-only
      nix_path:
        required: false
        type: string
        default: nixpkgs=channel:nixos-26.05
        description: "Nix path to use"
      build_file:
        required: false
        type: string
        default: "Cargo.toml"
        description: "File to extract version from"
      docker_image_name:
        required: true
        type: string
        description: "Docker image name"
      docker_gcp_registry:
        required: false
        type: string
        default: "europe-west3-docker.pkg.dev/hoprassociation/docker-images"
        description: "Docker registry to push the image to"
      docker_hub_registry:
        required: false
        type: string
        default: "docker.io/hoprnet"
        description: "Docker registry to push the image to"
      docker_image_format:
        required: false
        type: string
        default: "docker"
        description: "Format to use when pushing docker images: 'docker' or 'skopeo'"
      docker_bucket_sboms:
        required: false
        type: string
        default: "docker-images-sboms"
        description: "GCS bucket to upload SBOM files to for Google Artifact vulnerability analysis"
      timeout_minutes:
        required: false
        type: number
        default: 60
        description: "Timeout for the job in minutes"
      fail_on_scan_vulnerabilities:
        required: false
        type: string
        description: "Whether to fail the build if vulnerabilities are found during the scan"
        default: "true"
      concurrency_group_suffix:
        required: false
        type: string
        default: ""
        description: "Additional string to group concurrency by. The final concurrency group will be in the format: {repository}-{branch}-{workflow}-docker-{concurrency_group}"
      job_runner:
        required: false
        type: string
        description: "Runner to use for the build job"
        default: depot-ubuntu-22.04-4
      gcp_workload_identity_provider:
        required: false
        type: string
        description: GCP Workload Identity Provider
        default: projects/277369779617/locations/global/workloadIdentityPools/github-workflow-pool/providers/github-provider
      gcp_service_account:
        required: false
        type: string
        description: GCP Service Account JSON for Artifact Registry access
        default: github-workflows@hoprassociation.iam.gserviceaccount.com
      enabled:
        required: false
        type: boolean
        default: true
        description: "Whether to run the build. When false every job is skipped (build is skipped, the dependent jobs follow)"
    secrets:
      cachix_auth_token:
        required: false
      docker_hub_username:
        required: false
      docker_hub_token:
        required: false
    outputs:
      docker_build_version:
        description: "Docker image version built"
        value: ${{ jobs.build.outputs.docker_build_version }}
      docker_debug_version:
        description: "Docker debug image version built"
        value: ${{ jobs.build.outputs.docker_debug_version }}
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-${{ github.workflow }}-docker-${{ inputs.concurrency_group_suffix }}
  cancel-in-progress: true
jobs:
  build:
    name: Build (${{ matrix.architecture }})
    if: inputs.enabled
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.build_matrix) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
      id-token: write # GCP Workload Identity
    outputs:
      docker_build_version: ${{ steps.version.outputs.docker_build_version }}
      docker_debug_version: ${{ steps.version.outputs.docker_debug_version }}
      major_version: ${{ steps.version.outputs.major_version }}
      minor_version: ${{ steps.version.outputs.minor_version }}
      publish_docker_hub: ${{ steps.docker_hub.outputs.publish_docker_hub }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          disable-sudo: true
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ inputs.repo_sha }}
      # Nix fetches dependencies in a sandbox with its own git processes that don't inherit the checkout token.
      - name: Configure git credentials for private repositories
        if: ${{ github.event.repository.private }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOKEN_B64=$(echo -n "x-access-token:${GH_TOKEN}" | base64 | tr -d '\n')
          CONFIG_FILE="${RUNNER_TEMP}/gitconfig-credentials"
          printf '[http "https://github.com/"]\n\textraheader = AUTHORIZATION: basic %s\n' "${TOKEN_B64}" > "${CONFIG_FILE}"
          echo "GIT_CONFIG_GLOBAL=${CONFIG_FILE}" >> "${GITHUB_ENV}"
      - name: Setup Nix
        uses: hoprnet/hopr-workflows/actions/setup-nix@8ce24b7561a6f7b46ed3133099b82828506f5f2d # setup-nix-v2.2.1
        with:
          cachix_cache_name: ${{ inputs.cachix_cache_name }}
          cachix_extra_pull_names: ${{ inputs.cachix_extra_pull_names }}
          cachix_auth_token: "${{ secrets.cachix_auth_token }}"
          nix_path: ${{ inputs.nix_path }}
      - name: Updates build version
        id: version
        uses: hoprnet/hopr-workflows/actions/set-build-version@1bf79c9e93a016d5913ab57abefa9bff5f76e010 # set-build-version (feat/fork-pr-ci-support)
        with:
          file: "${{ inputs.build_file }}"
          version_type: "${{ inputs.version_type }}"
          architecture: "${{ matrix.architecture }}"
      - name: Determine DockerHub publishing condition
        id: docker_hub
        run: |
          if [ "${VERSION_TYPE}" = "release" ] && [ -n "${DOCKER_HUB_USERNAME}" ] && [ -n "${DOCKER_HUB_TOKEN}" ]; then
            echo "publish_docker_hub=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "publish_docker_hub=false" | tee -a "$GITHUB_OUTPUT"
          fi
        env:
          VERSION_TYPE: ${{ inputs.version_type }}
          DOCKER_HUB_USERNAME: ${{ secrets.docker_hub_username }}
          DOCKER_HUB_TOKEN: ${{ secrets.docker_hub_token }}
      - name: Build docker image - ${{ inputs.docker_image_name }}:${{ steps.version.outputs.docker_build_version_platform }}
        run: eval "${BUILD_COMMAND}"
        env:
          BUILD_COMMAND: ${{ matrix.build_command }}
          # buildx adds a provenance attestation by default, which turns the pushed
          # per-arch tag into a manifest list that `docker manifest create` rejects
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
      # Fork PRs have no GCP access: keep the built image as a run artifact so scan and smoke-test can use it
      - name: Save docker image archive (fork PR)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if [[ "${DOCKER_IMAGE_FORMAT}" == "docker" ]]; then
            docker save "${DOCKER_IMAGE_NAME}:latest" --output docker-image.tar
          else
            cp -L ./result docker-image.tar
          fi
        env:
          DOCKER_IMAGE_FORMAT: ${{ inputs.docker_image_format }}
          DOCKER_IMAGE_NAME: ${{ inputs.docker_image_name }}
      - name: Upload docker image archive (fork PR)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: docker-image-${{ matrix.architecture }}
          path: docker-image.tar
          retention-days: 1
          compression-level: 0
      - name: Build debug docker image - ${{ inputs.docker_image_name }}:${{ steps.version.outputs.docker_debug_version_platform }}
        if: steps.version.outputs.docker_debug_version_platform != '' && matrix.build_debug_command != ''
        run: eval "${BUILD_DEBUG_COMMAND}"
        env:
          BUILD_DEBUG_COMMAND: ${{ matrix.build_debug_command }}
          BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
      - name: Setup GCP
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        id: gcp
        uses: hoprnet/hopr-workflows/actions/setup-gcp@2ca6e5b55819505e4e304ed3b0ff62da01cc7c0e # setup-gcp-v4.0.3
        with:
          workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          service_account: ${{ inputs.gcp_service_account }}
          login_artifact_registry: 'true'
      - name: Log in to DockerHub
        if: steps.docker_hub.outputs.publish_docker_hub == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.docker_hub_username }}
          password: ${{ secrets.docker_hub_token }}
      - name: Publish docker image - ${{ inputs.docker_image_name }}:${{ steps.version.outputs.docker_build_version_platform }}
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        run: |
          nix shell github:hoprnet/nix-lib#skopeo -c bash << 'SKOPEO'
            set -euo pipefail
            # base.ref is only set on pull_request events; release runs are workflow_dispatch
            base_branch="${BASE_REF}"
            publish_image() {
              local target_image="${1}"
              echo "Publishing image ${target_image}"
              if [[ "${DOCKER_IMAGE_FORMAT}" == "skopeo" ]]; then
                skopeo --insecure-policy copy docker-archive:./result "docker://${target_image}"
              elif [[ "${DOCKER_IMAGE_FORMAT}" == "docker" ]]; then
                docker tag "${DOCKER_IMAGE_NAME}:latest" "${target_image}"
                docker push "${target_image}"
              fi
              echo "Published image ${target_image}"
            }
            # Default image tag for all version types
            publish_image "${GCP_IMAGE_NAME}"

            # Edge publish condition: only publish edge image for x86_64 architecture
            if [[ "${DEPLOY_COMMITS}" == "true" && "${ARCHITECTURE}" == "x86_64-linux" ]]; then
              publish_image "${GCP_EDGE_IMAGE_NAME}"
            fi

            # Close PR tags
            if [[ "${VERSION_TYPE}" == "pr" ]]; then
              if [[ "${base_branch}" == "main" ]] || [[ "${base_branch}" == "master" ]]; then
                publish_image "${GCP_LATEST_IMAGE_NAME}"
                publish_image "${GCP_LATEST_MAIN_IMAGE_NAME}"
              elif [[ "${base_branch}" =~ ^release/* ]]; then
                publish_image "${GCP_LATEST_TESTING_IMAGE_NAME}"
              fi
            fi

            # Release tags
            if [[ "${VERSION_TYPE}" == "release" ]]; then
              if [[ "${base_branch}" == "main" ]] || [[ "${base_branch}" == "master" ]]; then
                publish_image "${GCP_RELEASE_MAIN_IMAGE_NAME}"
              elif [[ "${base_branch}" =~ ^release/* ]]; then
                publish_image "${GCP_RELEASE_TESTING_IMAGE_NAME}"
              fi
              if [[ "${PUBLISH_DOCKER_HUB}" == "true" ]]; then
                publish_image "${DOCKER_HUB_IMAGE_NAME}"
              fi
            fi
          SKOPEO
        env:
          GCP_IMAGE_NAME: ${{ inputs.docker_gcp_registry }}/${{ inputs.docker_image_name }}:${{ steps.version.outputs.docker_build_version_platform }}
          GCP_EDGE_IMAGE_NAME: ${{ inputs.docker_gcp_registry }}/${{ inputs.docker_image_name }}:edge
          GCP_LATEST_IMAGE_NAME: ${{ inputs.docker_gcp_registry }}/${{ inputs.docker_image_name }}:latest-${{ steps.version.outputs.docker_platform }}
          GCP_LATEST_MAIN_IMAGE_NAME: ${{ inputs.docker_gcp_registry }}/${{ inputs.docker_image_name }}:latest-main-${{ steps.version.outputs.docker_platform }}
          GCP_LATEST_TESTING_IMAGE_NAME: ${{ inputs.docker_gcp_registry }}/${{ inputs.docker_image_name }}:latest-testing-${{ steps.version.outputs.docker_platform }}
          GCP_RELEASE_MAIN_IMAGE_NAME: ${{ inputs.docker_gcp_registry }}/${{ inputs.docker_image_name }}:release-main-${{ steps.version.outputs.docker_platform }}
          GCP_RELEASE_TESTING_IMAGE_NAME: ${{ inputs.docker_gcp_registry }}/${{ inputs.docker_image_name }}:release-testing-${{ steps.version.outputs.docker_platform }}
          DOCKER_HUB_IMAGE_NAME: ${{ inputs.docker_hub_registry }}/${{ inputs.docker_image_name }}:${{ steps.version.outputs.docker_build_version_platform }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
          DOCKER_IMAGE_FORMAT: ${{ inputs.docker_image_format }}
          DOCKER_IMAGE_NAME: ${{ inputs.docker_image_name }}
          DEPLOY_COMMITS: ${{ steps.version.outputs.deploy_commits }}
          ARCHITECTURE: ${{ matrix.architecture }}
          VERSION_TYPE: ${{ inputs.version_type }}
          PUBLISH_DOCKER_HUB: ${{ steps.docker_hub.outputs.publish_docker_hub }}
      - name: Publish debug docker image - ${{ inputs.docker_image_name }}:${{ steps.version.outputs.docker_debug_version_platform }}
        if: steps.version.outputs.docker_debug_version_platform != '' && matrix.build_debug_command != '' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          nix shell github:hoprnet/nix-lib#skopeo -c bash << 'SKOPEO'
            set -euo pipefail
            echo "Publishing image ${GCP_DEBUG_IMAGE_NAME}"
            if [[ "${DOCKER_IMAGE_FORMAT}" == "skopeo" ]]; then
              skopeo --insecure-policy copy docker-archive:./result "docker://${GCP_DEBUG_IMAGE_NAME}"
            elif [[ "${DOCKER_IMAGE_FORMAT}" == "docker" ]]; then
              docker tag "${DOCKER_IMAGE_NAME}:latest" "${GCP_DEBUG_IMAGE_NAME}"
              docker push "${GCP_DEBUG_IMAGE_NAME}"
            fi
            echo "Published image ${GCP_DEBUG_IMAGE_NAME}"
          SKOPEO
        env:
          GCP_DEBUG_IMAGE_NAME: ${{ inputs.docker_gcp_registry }}/${{ inputs.docker_image_name }}:${{ steps.version.outputs.docker_debug_version_platform }}
          DOCKER_IMAGE_FORMAT: ${{ inputs.docker_image_format }}
          DOCKER_IMAGE_NAME: ${{ inputs.docker_image_name }}
      - name: Remove git credentials
        if: ${{ github.event.repository.private && always() }}
        run: |
          rm -f "${GIT_CONFIG_GLOBAL}" || true
          echo "GIT_CONFIG_GLOBAL=" >> "${GITHUB_ENV}"
  manifest:
    name: Multi-Arch
    runs-on: ${{ inputs.job_runner }}
    needs: build
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
    permissions:
      contents: read
      id-token: write # GCP Workload Identity
    steps:
      - name: Setup GCP
        id: gcp
        uses: hoprnet/hopr-workflows/actions/setup-gcp@2ca6e5b55819505e4e304ed3b0ff62da01cc7c0e # setup-gcp-v4.0.3
        with:
          workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          service_account: ${{ inputs.gcp_service_account }}
          login_artifact_registry: 'true'
          install_sdk: 'false'
      - name: Create multi-arch docker manifest - ${{ needs.build.outputs.docker_build_version }}
        uses: hoprnet/hopr-workflows/actions/multi-arch-manifest@ff46635ff5da2d33f0bbedf32a7030dc2fe1895a # source_version support
        with:
          registry: ${{ inputs.docker_gcp_registry }}
          image: ${{ inputs.docker_image_name }}
          version: ${{ needs.build.outputs.docker_build_version }}
      - name: Create multi-arch docker manifest - major ${{ needs.build.outputs.major_version }}
        if: needs.build.outputs.major_version != ''
        uses: hoprnet/hopr-workflows/actions/multi-arch-manifest@ff46635ff5da2d33f0bbedf32a7030dc2fe1895a # source_version support
        with:
          registry: ${{ inputs.docker_gcp_registry }}
          image: ${{ inputs.docker_image_name }}
          version: ${{ needs.build.outputs.major_version }}
          source_version: ${{ needs.build.outputs.docker_build_version }}
      - name: Create multi-arch docker manifest - major.minor ${{ needs.build.outputs.minor_version }}
        if: needs.build.outputs.minor_version != ''
        uses: hoprnet/hopr-workflows/actions/multi-arch-manifest@ff46635ff5da2d33f0bbedf32a7030dc2fe1895a # source_version support
        with:
          registry: ${{ inputs.docker_gcp_registry }}
          image: ${{ inputs.docker_image_name }}
          version: ${{ needs.build.outputs.minor_version }}
          source_version: ${{ needs.build.outputs.docker_build_version }}
      - name: Create debug multi-arch docker manifest - ${{ needs.build.outputs.docker_debug_version }}
        if: needs.build.outputs.docker_debug_version != ''
        uses: hoprnet/hopr-workflows/actions/multi-arch-manifest@ff46635ff5da2d33f0bbedf32a7030dc2fe1895a # source_version support
        with:
          registry: ${{ inputs.docker_gcp_registry }}
          image: ${{ inputs.docker_image_name }}
          version: ${{ needs.build.outputs.docker_debug_version }}
      - name: Create multi-arch docker manifest - latest
        if: inputs.version_type == 'pr' && (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'master')
        uses: hoprnet/hopr-workflows/actions/multi-arch-manifest@ff46635ff5da2d33f0bbedf32a7030dc2fe1895a # source_version support
        with:
          registry: ${{ inputs.docker_gcp_registry }}
          image: ${{ inputs.docker_image_name }}
          version: latest
      - name: Create multi-arch docker manifest - latest-main
        if: inputs.version_type == 'pr' && (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'master')
        uses: hoprnet/hopr-workflows/actions/multi-arch-manifest@ff46635ff5da2d33f0bbedf32a7030dc2fe1895a # source_version support
        with:
          registry: ${{ inputs.docker_gcp_registry }}
          image: ${{ inputs.docker_image_name }}
          version: latest-main
      - name: Create multi-arch docker manifest - latest-testing
        if: inputs.version_type == 'pr' && startsWith(github.event.pull_request.base.ref || github.ref_name, 'release/')
        uses: hoprnet/hopr-workflows/actions/multi-arch-manifest@ff46635ff5da2d33f0bbedf32a7030dc2fe1895a # source_version support
        with:
          registry: ${{ inputs.docker_gcp_registry }}
          image: ${{ inputs.docker_image_name }}
          version: latest-testing
      - name: Create multi-arch docker manifest - release-main
        if: inputs.version_type == 'release' && (github.ref_name == 'main' || github.ref_name == 'master')
        uses: hoprnet/hopr-workflows/actions/multi-arch-manifest@ff46635ff5da2d33f0bbedf32a7030dc2fe1895a # source_version support
        with:
          registry: ${{ inputs.docker_gcp_registry }}
          image: ${{ inputs.docker_image_name }}
          version: release-main
      - name: Create multi-arch docker manifest - release-testing
        if: inputs.version_type == 'release' && startsWith(github.ref_name, 'release/')
        uses: hoprnet/hopr-workflows/actions/multi-arch-manifest@ff46635ff5da2d33f0bbedf32a7030dc2fe1895a # source_version support
        with:
          registry: ${{ inputs.docker_gcp_registry }}
          image: ${{ inputs.docker_image_name }}
          version: release-testing
      - name: Determine DockerHub publishing condition
        id: docker_hub
        run: |
          if [ "${VERSION_TYPE}" = "release" ] && [ -n "${DOCKER_HUB_USERNAME}" ] && [ -n "${DOCKER_HUB_TOKEN}" ]; then
            echo "publish_docker_hub=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "publish_docker_hub=false" | tee -a "$GITHUB_OUTPUT"
          fi
        env:
          VERSION_TYPE: ${{ inputs.version_type }}
          DOCKER_HUB_USERNAME: ${{ secrets.docker_hub_username }}
          DOCKER_HUB_TOKEN: ${{ secrets.docker_hub_token }}
      - name: Log in to Docker Hub
        if: steps.docker_hub.outputs.publish_docker_hub == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.docker_hub_username }}
          password: ${{ secrets.docker_hub_token }}
      - name: Create multi-arch docker manifest - Docker Hub - ${{ needs.build.outputs.docker_build_version }}
        if: steps.docker_hub.outputs.publish_docker_hub == 'true'
        uses: hoprnet/hopr-workflows/actions/multi-arch-manifest@ff46635ff5da2d33f0bbedf32a7030dc2fe1895a # source_version support
        with:
          registry: ${{ inputs.docker_hub_registry }}
          image: ${{ inputs.docker_image_name }}
          version: ${{ needs.build.outputs.docker_build_version }}
      - name: Create multi-arch docker manifest - Docker Hub - major ${{ needs.build.outputs.major_version }}
        if: steps.docker_hub.outputs.publish_docker_hub == 'true' && needs.build.outputs.major_version != ''
        uses: hoprnet/hopr-workflows/actions/multi-arch-manifest@ff46635ff5da2d33f0bbedf32a7030dc2fe1895a # source_version support
        with:
          registry: ${{ inputs.docker_hub_registry }}
          image: ${{ inputs.docker_image_name }}
          version: ${{ needs.build.outputs.major_version }}
          source_version: ${{ needs.build.outputs.docker_build_version }}
      - name: Create multi-arch docker manifest - Docker Hub - major.minor ${{ needs.build.outputs.minor_version }}
        if: steps.docker_hub.outputs.publish_docker_hub == 'true' && needs.build.outputs.minor_version != ''
        uses: hoprnet/hopr-workflows/actions/multi-arch-manifest@ff46635ff5da2d33f0bbedf32a7030dc2fe1895a # source_version support
        with:
          registry: ${{ inputs.docker_hub_registry }}
          image: ${{ inputs.docker_image_name }}
          version: ${{ needs.build.outputs.minor_version }}
          source_version: ${{ needs.build.outputs.docker_build_version }}
  scan:
    name: Scan (${{ matrix.architecture }})
    needs: build
    runs-on: ${{ inputs.job_runner }}
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.build_matrix) }}
    permissions:
      contents: read
      id-token: write # Required for cosign keyless attestation and GCP Workload Identity
    steps:
      - name: Setup Nix
        uses: hoprnet/hopr-workflows/actions/setup-nix@8ce24b7561a6f7b46ed3133099b82828506f5f2d # setup-nix-v2.2.1
        with:
          cachix_cache_name: ${{ inputs.cachix_cache_name }}
          cachix_extra_pull_names: ${{ inputs.cachix_extra_pull_names }}
          cachix_auth_token: "${{ secrets.cachix_auth_token }}"
          nix_path: ${{ inputs.nix_path }}
      - name: Set up Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
      - name: Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: 'v3.0.5'
      - name: Setup GCP
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        id: gcp
        uses: hoprnet/hopr-workflows/actions/setup-gcp@2ca6e5b55819505e4e304ed3b0ff62da01cc7c0e # setup-gcp-v4.0.3
        with:
          workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
          service_account: ${{ inputs.gcp_service_account }}
          login_artifact_registry: 'true'
          install_sdk: 'true'
      - name: Compute platform-specific tags
        id: platform
        run: |
          base_version="${DOCKER_BUILD_VERSION}"
          if [[ "${ARCHITECTURE}" == "aarch64-linux" ]]; then
            echo "docker_build_version_platform=${base_version}-linux-arm64" | tee -a "$GITHUB_OUTPUT"
            echo "docker_platform=linux-arm64" | tee -a "$GITHUB_OUTPUT"
          elif [[ "${ARCHITECTURE}" == "x86_64-linux" ]]; then
            echo "docker_build_version_platform=${base_version}-linux-amd64" | tee -a "$GITHUB_OUTPUT"
            echo "docker_platform=linux-amd64" | tee -a "$GITHUB_OUTPUT"
          else
            echo "Unsupported architecture: ${ARCHITECTURE}"
            exit 1
          fi
        env:
          DOCKER_BUILD_VERSION: ${{ needs.build.outputs.docker_build_version }}
          ARCHITECTURE: ${{ matrix.architecture }}
      - name: Download docker image archive (fork PR)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: docker-image-${{ matrix.architecture }}
      - name: Get docker image digest
        id: docker
        run: |
          gcp_docker_image="${DOCKER_GCP_REGISTRY}/${DOCKER_IMAGE_NAME}:${DOCKER_BUILD_VERSION_PLATFORM}"
          if [[ "${IS_FORK_PR}" == "true" ]]; then
            # No registry on fork PRs: load the archive built by the build job and tag it with the same reference
            loaded_image=$(docker load --input docker-image.tar | sed -n 's/^Loaded image: //p' | head -n 1)
            docker tag "${loaded_image}" "${gcp_docker_image}"
          else
            docker pull "${gcp_docker_image}" # Pull the image to inspect
          fi
          echo "gcp_docker_image=${gcp_docker_image}" | tee -a "$GITHUB_OUTPUT"
          if [[ "${IS_FORK_PR}" != "true" ]]; then
            gcp_docker_digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${gcp_docker_image}" | awk -F'@' '{print $2}')
            echo "gcp_docker_digest=${DOCKER_GCP_REGISTRY}/${DOCKER_IMAGE_NAME}@${gcp_docker_digest}" | tee -a "$GITHUB_OUTPUT"
          fi
          if [[ "${PUBLISH_DOCKER_HUB}" == "true" ]]; then
            docker_hub_image="${DOCKER_HUB_REGISTRY}/${DOCKER_IMAGE_NAME}:${DOCKER_BUILD_VERSION_PLATFORM}"
            docker pull "${docker_hub_image}" # Pull the image to inspect
            echo "docker_hub_image=${docker_hub_image}" | tee -a "$GITHUB_OUTPUT"
            docker_hub_digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${docker_hub_image}" | awk -F'@' '{print $2}')
            echo "docker_hub_digest=${DOCKER_HUB_REGISTRY}/${DOCKER_IMAGE_NAME}@${docker_hub_digest}" | tee -a "$GITHUB_OUTPUT"
          fi
          if [ "${FAIL_ON_SCAN_VULNERABILITIES}" = "true" ]; then
            echo "trivy_exit_code=1" | tee -a "$GITHUB_OUTPUT"
          else
            echo "trivy_exit_code=0" | tee -a "$GITHUB_OUTPUT"
          fi
        env:
          DOCKER_GCP_REGISTRY: ${{ inputs.docker_gcp_registry }}
          DOCKER_IMAGE_NAME: ${{ inputs.docker_image_name }}
          DOCKER_BUILD_VERSION_PLATFORM: ${{ steps.platform.outputs.docker_build_version_platform }}
          PUBLISH_DOCKER_HUB: ${{ needs.build.outputs.publish_docker_hub }}
          DOCKER_HUB_REGISTRY: ${{ inputs.docker_hub_registry }}
          FAIL_ON_SCAN_VULNERABILITIES: ${{ inputs.fail_on_scan_vulnerabilities }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Run Trivy
        if: inputs.version_type == 'commit'
        run: |
          nix shell nixpkgs#trivy -c trivy image \
            --exit-code "${TRIVY_EXIT_CODE}" \
            --ignore-unfixed \
            --vuln-type "os,library" \
            --severity "HIGH,CRITICAL" \
            --format json \
            --output trivy.json \
            "${DOCKER_GCP_REGISTRY}/${DOCKER_IMAGE_NAME}:${DOCKER_BUILD_VERSION_PLATFORM}"
        env:
          TRIVY_EXIT_CODE: ${{ steps.docker.outputs.trivy_exit_code }}
          DOCKER_GCP_REGISTRY: ${{ inputs.docker_gcp_registry }}
          DOCKER_IMAGE_NAME: ${{ inputs.docker_image_name }}
          DOCKER_BUILD_VERSION_PLATFORM: ${{ steps.platform.outputs.docker_build_version_platform }}
      - name: Build Security Report Markdown
        if: inputs.version_type == 'commit'
        id: trivy_report
        run: |
          {
            echo "## 🔎 Trivy Security Report"
            echo ""
            echo "| Target | Package  | Installed  | Severity | CVE |"
            echo "|--------|----------|------------|----------|-----|"
          } > trivy-header.md
          {
            jq -r '
              .Results[]?
              | select(.Vulnerabilities != null)
              | .Target as $target
              | .Vulnerabilities[]?
              | "| \($target) | \(.PkgName) | \(.InstalledVersion) | \(.Severity) | \(.VulnerabilityID) |"
            ' trivy.json || echo "| - | Could not process Trivy results | - | - | - |"

          } > trivy-results.md
          if [ -s trivy-results.md ]; then
            cat trivy-header.md trivy-results.md > trivy-report.md
            echo "trivy_vulnerabilities_found=true" | tee -a "$GITHUB_OUTPUT"
          else
            {
              echo "## 🔎 Trivy Security Report"
              echo ""
              echo "No vulnerabilities found or failed to process Trivy results"
            } > trivy-report.md
            echo "trivy_vulnerabilities_found=false" | tee -a "$GITHUB_OUTPUT"
          fi
          # The report lives in the workflow run summary (no PR comment, so no write permission is needed)
          cat trivy-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Generate SBOM
        run: |
          nix shell nixpkgs#trivy -c trivy image \
            --format cyclonedx \
            --output sbom.json \
            "${GCP_DOCKER_IMAGE}"
        env:
          GCP_DOCKER_IMAGE: ${{ steps.docker.outputs.gcp_docker_image }}
      - name: Attest SBOM on GCP Artifact Registry
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        run: cosign attest --predicate "sbom.json" --type cyclonedx "${GCP_DOCKER_DIGEST}"
        env:
          COSIGN_YES: "true"
          GCP_DOCKER_DIGEST: ${{ steps.docker.outputs.gcp_docker_digest }}
      - name: Upload SBOM file to GCS Bucket for Google Artifact vulnerability analysis
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        run: |
          gcloud artifacts sbom load \
            --source sbom.json \
            --uri "${DOCKER_GCP_REGISTRY}/${DOCKER_IMAGE_NAME}:${DOCKER_BUILD_VERSION_PLATFORM}" \
            --destination "gs://${DOCKER_BUCKET_SBOMS}"
        env:
          DOCKER_GCP_REGISTRY: ${{ inputs.docker_gcp_registry }}
          DOCKER_IMAGE_NAME: ${{ inputs.docker_image_name }}
          DOCKER_BUILD_VERSION_PLATFORM: ${{ steps.platform.outputs.docker_build_version_platform }}
          DOCKER_BUCKET_SBOMS: ${{ inputs.docker_bucket_sboms }}
      - name: Log in to DockerHub
        if: needs.build.outputs.publish_docker_hub == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.docker_hub_username }}
          password: ${{ secrets.docker_hub_token }}
      - name: Attach SBOM to DockerHub for attestation
        if: needs.build.outputs.publish_docker_hub == 'true'
        run: cosign attest --predicate "sbom.json" --type cyclonedx "${DOCKER_HUB_DIGEST}"
        env:
          COSIGN_YES: "true"
          DOCKER_HUB_DIGEST: ${{ steps.docker.outputs.docker_hub_digest }}
  smoke-test:
    name: Smoke Test (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.build_matrix) }}
    if: vars.RUN_DOCKER_SMOKE_TESTS == 'true'
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ inputs.repo_sha }}
      # Nix fetches dependencies in a sandbox with its own git processes that don't inherit the checkout token.
      - name: Configure git credentials for private repositories
        if: ${{ github.event.repository.private }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOKEN_B64=$(echo -n "x-access-token:${GH_TOKEN}" | base64 | tr -d '\n')
          CONFIG_FILE="${RUNNER_TEMP}/gitconfig-credentials"
          printf '[http "https://github.com/"]\n\textraheader = AUTHORIZATION: basic %s\n' "${TOKEN_B64}" > "${CONFIG_FILE}"
          echo "GIT_CONFIG_GLOBAL=${CONFIG_FILE}" >> "${GITHUB_ENV}"
      - name: Setup Nix
        uses: hoprnet/hopr-workflows/actions/setup-nix@8ce24b7561a6f7b46ed3133099b82828506f5f2d # setup-nix-v2.2.1
        with:
          cachix_cache_name: ${{ inputs.cachix_cache_name }}
          cachix_extra_pull_names: ${{ inputs.cachix_extra_pull_names }}
          cachix_auth_token: "${{ secrets.cachix_auth_token }}"
          nix_path: ${{ inputs.nix_path }}
      - name: Download docker image archive (fork PR)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: docker-image-${{ matrix.architecture }}
      - name: Load docker image (fork PR)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          # No registry on fork PRs: tag the locally built image with the reference the smoke test expects
          loaded_image=$(docker load --input docker-image.tar | sed -n 's/^Loaded image: //p' | head -n 1)
          docker tag "${loaded_image}" "${SOURCE_IMAGE}"
        env:
          SOURCE_IMAGE: "${{ inputs.docker_gcp_registry }}/${{ inputs.docker_image_name }}:${{ needs.build.outputs.docker_build_version }}"
      - name: Run smoke tests
        if: matrix.smoke_test_command != ''
        run: eval "${SMOKE_TEST_COMMAND}" 2>&1 | tee test.logs
        env:
          SOURCE_IMAGE: "${{ inputs.docker_gcp_registry }}/${{ inputs.docker_image_name }}:${{ needs.build.outputs.docker_build_version }}"
          SMOKE_TEST_COMMAND: ${{ matrix.smoke_test_command }}
      - name: Upload logs on failure
        if: failure() && matrix.smoke_test_command != ''
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: smoke-test-logs-${{ matrix.architecture }}
          path: test.logs
          retention-days: 7
      - name: Remove git credentials
        if: ${{ github.event.repository.private && always() }}
        run: |
          rm -f "${GIT_CONFIG_GLOBAL}" || true
          echo "GIT_CONFIG_GLOBAL=" >> "${GITHUB_ENV}"
