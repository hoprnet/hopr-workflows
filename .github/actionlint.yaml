self-hosted-runner:
  # Depot-managed runners used across this repository
  labels:
    - depot-ubuntu-22.04
    - depot-ubuntu-22.04-4
    - depot-ubuntu-24.04-8
    - depot-ubuntu-24.04-16
paths:
  # actionlint's job context type predates job.workflow_repository and
  # job.workflow_sha (documented GitHub contexts).
  .github/workflows/cargo-policy.yaml:
    ignore:
      - 'property "workflow_(repository|sha)" is not defined in object type'
