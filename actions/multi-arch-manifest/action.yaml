name: Multi-Arch Manifest
description: Create a multi-arch docker manifest
inputs:
  registry:
    description: Docker registry to push the image to
    required: true
    default: europe-west3-docker.pkg.dev/hoprassociation/docker-images
  image:
    description: Docker image name
    required: true
  version:
    description: Docker image version
    required: true
  source_version:
    description: >-
      Version whose per-arch images (<source_version>-<arch>) are used as the manifest members. Defaults to `version`. Set it to point a floating tag (e.g. a bare major "5") at the images pushed under the full version.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Create multi-arch docker manifest
      id: manifest
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        IMAGE: ${{ inputs.image }}
        VERSION: ${{ inputs.version }}
        SOURCE_VERSION: ${{ inputs.source_version }}
      run: bash "${{ github.action_path }}/multi-arch-manifest.sh"
