name: Setup Nix
description: Setup Nix environment
inputs:
  cachix_cache_name:
    description: Name of the Cachix cache to use
    required: false
  cachix_auth_token:
    description: Cachix authentication token
    required: false
  cachix_extra_pull_names:
    description: Comma-separated list of additional Cachix caches to pull (substitute) from, read-only
    required: false
  nix_path:
    description: Nix path to use
    required: false
    default: nixpkgs=channel:nixos-26.05
runs:
  using: composite
  steps:
    - name: Check Nix installation
      id: check-nix
      shell: bash
      run: |
        if command -v nix > /dev/null 2>&1; then
          echo "installed=true" | tee -a $GITHUB_OUTPUT
        else
          echo "installed=false" | tee -a $GITHUB_OUTPUT
        fi
    - name: Install Nix
      if: steps.check-nix.outputs.installed != 'true'
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      with:
        nix_path: ${{ inputs.nix_path }}
    - name: Set cache name
      id: cache-name
      if: steps.check-nix.outputs.installed != 'true'
      shell: bash
      run: |
        if [ -z "${CACHIX_CACHE_NAME}" ]; then
          repo_name=$(basename "${{ github.repository }}")
          echo "cachix_cache_name=${repo_name}" | tee -a $GITHUB_OUTPUT
        else
          echo "cachix_cache_name=${CACHIX_CACHE_NAME}" | tee -a $GITHUB_OUTPUT
        fi
      env:
        CACHIX_CACHE_NAME: ${{ inputs.cachix_cache_name }}
    - name: Use Nix Cache
      if: steps.check-nix.outputs.installed != 'true'
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      continue-on-error: true # Allow failure if cachix cache/token is unavailable
      with:
        name: ${{ steps.cache-name.outputs.cachix_cache_name }}
        authToken: ${{ inputs.cachix_auth_token }}
        extraPullNames: ${{ inputs.cachix_extra_pull_names }}
      env:
        USER: runner
