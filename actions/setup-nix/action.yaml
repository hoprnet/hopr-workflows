name: Setup Nix
description: Setup Nix environment
inputs:
  cachix_cache_name:
    description: Name of the Cachix cache to use
    required: false
  cachix_auth_token:
    description: Cachix authentication token
    required: false
  nix_path:
    description: Nix path to use
    required: false
    default: nixpkgs=channel:nixos-26.05
runs:
  using: composite
  steps:
    - name: Check Nix installation
      id: check-nix
      shell: bash
      run: |
        if command -v nix > /dev/null 2>&1; then
          echo "installed=true" | tee -a $GITHUB_OUTPUT
        else
          echo "installed=false" | tee -a $GITHUB_OUTPUT
        fi
    - name: Install Nix
      if: steps.check-nix.outputs.installed != 'true'
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        nix_path: ${{ inputs.nix_path }}
    - name: Set cache name
      id: cache-name
      if: steps.check-nix.outputs.installed != 'true'
      shell: bash
      run: |
        if [ -z "${{ inputs.cachix_cache_name }}" ]; then
          repo_name=$(basename "${{ github.repository }}")
          echo "cachix_cache_name=${repo_name}" | tee -a $GITHUB_OUTPUT
        else
          echo "cachix_cache_name=${{ inputs.cachix_cache_name }}" | tee -a $GITHUB_OUTPUT
        fi
    - name: Use Nix Cache
      if: steps.check-nix.outputs.installed != 'true' && inputs.cachix_auth_token != ''
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      continue-on-error: true # Allow failure if cachix cache/token is unavailable
      with:
        name: ${{ steps.cache-name.outputs.cachix_cache_name }}
        authToken: ${{ inputs.cachix_auth_token }}
      env:
        USER: runner
