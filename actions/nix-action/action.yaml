name: Nix Action
description: >
  Composite action that handles the common CI boilerplate: harden runner, checkout, Nix/Cachix setup (via setup-nix), and command execution.

inputs:
  command:
    description: Shell command(s) to execute (supports multi-line)
    required: true
  source_branch:
    description: Git branch to checkout
    required: false
    default: main
  cachix_cache_name:
    description: Cachix cache name. Empty defaults to the caller repository name (passed to setup-nix)
    required: false
  cachix_auth_token:
    description: Cachix authentication token (passed to setup-nix)
    required: false
    default: ""
  nix_path:
    description: Nix path to use (passed to setup-nix)
    required: false
    default: nixpkgs=channel:nixos-26.05
  disable_sudo:
    description: Whether to disable sudo in harden-runner
    required: false
    default: "true"
  persist_credentials:
    description: Whether to persist git credentials after checkout
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        disable-sudo: ${{ inputs.disable_sudo }}
        egress-policy: audit
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: ${{ inputs.persist_credentials }}
        ref: ${{ inputs.source_branch }}
    - name: Setup Nix
      uses: hoprnet/hopr-workflows/actions/setup-nix@ade4bbd75f7204255c61d19c23f67d3da221e7d2 # setup-nix-v2.0.2
      with:
        cachix_cache_name: ${{ inputs.cachix_cache_name }}
        cachix_auth_token: ${{ inputs.cachix_auth_token }}
        nix_path: ${{ inputs.nix_path }}
    - name: Run command
      shell: bash
      run: ${{ inputs.command }}
